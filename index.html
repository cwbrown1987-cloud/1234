<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#141d33">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Footy Fortress">
<title>Footy Fortress</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="c"></canvas>

<!-- top bar -->
<div id="top">
  <div class="tl">
    <div class="badge" id="clubBadge" data-uibg="profile-badge"><i class="dot hide" id="profDot"></i>
      <img class="badgeimg" id="g" alt="">
      <div><div class="nmrow"><span class="lvl" id="lvlBadge" title="Experience level">1</span><span id="clubName">Footy Fortress</span></div><div class="sub">🏆 <span id="tro">0</span> · <span id="lg"></span></div></div>
    </div>
    <div class="row2"><div class="pill small" id="builders">👷 0/0</div><div class="pill small" id="seasonCd" title="Time until the next AFL season"></div><div class="pill small shield hide" id="shield"></div></div>
  </div>
  <div class="tr">
    <div class="res" data-r="pies"><div class="fill" style="background:linear-gradient(#ffd96a,#e9a92a)"></div><span class="v"></span><span class="cap"></span><i>🥧</i></div>
    <div class="res" data-r="drink"><div class="fill" style="background:linear-gradient(#7fe3ff,#1aa3d6)"></div><span class="v"></span><span class="cap"></span><i>💧</i></div>
    <div class="res medals" data-r="medals"><span class="v"></span><i>🏅</i><button class="plus" id="buyMedals" aria-label="Shop">+</button></div>
  </div>
</div>

<!-- home buttons -->
<div id="homeBtns">
  <button class="round attack" id="btnAttack"><i class="uia" data-ui="ico-battle" aria-hidden="true">⚔️</i><span>Battle</span><i class="dot hide" id="logDot" aria-hidden="true"></i></button>
  <button class="round shop" id="btnShop"><i class="uia" data-ui="ico-build" aria-hidden="true">🔨</i><span>Build</span></button>
</div>
<div id="side">
  <button class="sidebtn" id="btnCards"><i class="uia" data-ui="ico-cards" aria-hidden="true"><img id="cardsIco" alt="" width="30" height="30"></i><span>Cards</span><i class="dot hide" id="cardDot"></i></button>
  <button class="sidebtn" id="btnTasks"><i class="uia" data-ui="ico-pass" aria-hidden="true">🎫</i><span>Pass</span><i class="dot hide" id="taskDot"></i></button>
  <button class="sidebtn" id="btnEvents"><i class="uia" data-ui="ico-events" aria-hidden="true">📅</i><span>Events</span><i class="dot hide" id="eventDot" aria-hidden="true">!</i></button>
  <button class="sidebtn" id="btnSocial"><i class="uia" data-ui="ico-online" aria-hidden="true">🏟️</i><span>Online</span><i class="dot hide" id="socialDot"></i></button>
</div>
<div id="eventBanner" class="hide"></div>
<div id="rotateMsg" class="hide"><div>📱<b>Turn your phone upright</b></div></div>

<div id="selPanel"></div>
<div id="placePanel">
  <button class="btn red" id="placeNo" aria-label="Cancel placement"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg></button>
  <div class="place-copy"><b id="placeName"></b><small id="placeHint"></small></div>
  <button class="btn green" id="placeYes" aria-label="Confirm placement"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 4.5 4.5L19 7"/></svg></button>
</div>

<!-- battle -->
<div id="battleTop">
  <div class="panel bl"><img class="badgeimg sm" id="bBadge" alt=""><div><div id="bVs"></div><div class="sub"><span id="bLoot"></span></div></div></div>
  <div class="battleClock"><small>Battle Ends In</small><span id="bTime">3:00</span></div>
  <div class="panel br"><div id="bScore"></div><div class="sub"><span id="bStars"></span></div></div>
</div>
<div id="battleHint">Tap the grass to send players in<br><small>Red zone = too close to buildings</small></div>
<div id="battleBottom">
  <div class="row"><button class="btn red" id="bEnd">End Match</button><button class="btn gold" id="bNext" style="display:none">Next ⏭</button><div id="abilities"></div></div>
  <div id="cards"></div>
</div>

<div id="replayBar"><span class="panel">▶ Replay</span><button class="btn blue" id="rSpeed">1×</button><button class="btn red" id="rExit">Exit</button></div>
<div class="modal" id="modal"><div class="card"><button class="x" id="modalX" aria-label="Close or go back">✖</button><div id="modalHead"></div><div id="modalBody"></div><div id="modalActions"></div></div></div>
<div id="toast"></div>
<div id="tut" class="tut hide atBottom"><img id="tutAvatar" alt=""><div class="tb"><div id="tutText"></div><div class="tbtns"><button class="btn green hide" id="tutNext">Next</button><button class="lnk hide" id="tutSkip2"></button></div></div></div>
<div id="tutHand" class="hide">👆</div>

<script src="js/data.js"></script>
<script src="js/render.js"></script>
<script src="art/sheets.js"></script>
<script src="js/art.js"></script>
<script src="js/stadium.js"></script>
<script src="js/game.js"></script>
<script src="js/battle.js"></script>
<script src="js/season.js"></script>
<script src="js/raid.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/cardset.js"></script>
<script src="js/cards.js"></script>
<script src="js/gear.js"></script>
<script src="js/hubs.js"></script>
<script src="js/tutorial.js"></script>
<script src="js/net.js"></script>
<div id="installPrompt" class="hide"><div class="ipcard"><img src="icons/icon-192.png" alt=""><h2>Install Footy Fortress</h2><div id="installSteps"></div><div class="ipbtns"><button class="btn green big hide" id="installGo">Install</button><button class="btn" id="installLater">Not now</button></div></div></div>
<script src="js/install.js"></script>
<script>loadFootyArt(); boot();</script>
</body>
</html>
